<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="popup.css">
    <script src="store-regions.js"></script>
    <script src="app-store-url.js"></script>
    <script type="module" src="popup.js"></script>
</head>
<body>
    <main class="popup">
        <section class="section">
            <div class="section-title-row">
                <label class="section-toggle">
                    <input id="enabled" type="checkbox">
                    <span id="fixed-region-label">Fix country or region</span>
                </label>
                <div class="current-region-wrap">
                    <p id="current-region" class="current-region" aria-label="Current fixed region: CN">🇨🇳 CN</p>
                    <button class="text-button" id="region-edit-toggle" type="button" aria-expanded="false" aria-controls="region-editor">Edit</button>
                </div>
            </div>

            <div id="region-editor" class="region-editor" hidden>
                <label class="search-field compact-search" for="region-search">
                    <input id="region-search" type="search" aria-label="Search country, region, or code" placeholder="Search country, region, or code">
                </label>

                <div id="region-filter" class="filter-row" role="tablist" aria-label="Filter fixed region by location"></div>
                <div id="region-grid" class="region-grid" role="radiogroup" aria-label="Fixed region"></div>
                <button class="more-button" id="region-more" type="button">Show all regions</button>
            </div>

            <div class="setting-row">
                <div class="setting-heading-row">
                    <span id="force-open-mode-label">Force App Store links to open in Safari</span>
                    <div class="segmented-control" id="force-open-mode" role="radiogroup" aria-label="Force App Store links to open in Safari">
                        <button type="button" role="radio" data-force-open-mode="off">Off</button>
                        <button type="button" role="radio" data-force-open-mode="new-window">Window</button>
                        <button type="button" role="radio" data-force-open-mode="new-tab">Tab</button>
                    </div>
                </div>
                <p id="force-open-mode-description" class="setting-description">Open apps.apple.com links in Safari instead of handing them to App Store.</p>
            </div>
        </section>

        <section class="section quick-section" hidden>
            <div class="section-title-row">
                <h1 id="quick-jump-title">Quick Jump</h1>
                <div class="settings-wrap">
                    <button class="icon-button" id="quick-settings" type="button" aria-expanded="false" aria-controls="quick-menu" title="Jump settings" aria-label="Jump settings">⚙</button>
                    <div class="settings-menu" id="quick-menu" role="menu" hidden>
                        <button type="button" role="menuitemradio" data-open-mode="current-tab">Open in current tab</button>
                        <button type="button" role="menuitemradio" data-open-mode="new-tab">Open in new tab</button>
                    </div>
                </div>
            </div>

            <label class="search-field" for="quick-search">
                <input id="quick-search" type="search" aria-label="Search country, region, or code" placeholder="Search country, region, or code">
            </label>

            <div id="quick-filter" class="filter-row" role="tablist" aria-label="Filter quick jump regions by location"></div>
            <div id="quick-grid" class="quick-grid" aria-label="Quick jump regions"></div>
            <button class="more-button" id="quick-more" type="button">Show all regions</button>
        </section>

        <p id="status" role="status"></p>
    </main>
</body>
</html>
